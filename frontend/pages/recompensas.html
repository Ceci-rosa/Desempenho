              <tr>
                <td>Certificado de Destaque</td>

                <td><span class="status-pill">Ativo</span></td>

            </article>
            <article class="level-card">
              <div class="level-badge">🥇</div>
              <div class="level-info"><h4>Avançado</h4><p>8,5 – 10,0</p></div>
            </article>
          </div>
        </section>
